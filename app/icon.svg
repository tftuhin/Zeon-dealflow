<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#092540" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded hexagon / shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#092237" stroke="#134e4a" stroke-width="1.5" filter="url(#shadow)"/>
  
  <!-- Subtle decorative inner grid accent -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="#1e3a5f" stroke-width="0.8" opacity="0.6"/>

  <!-- Zeon DealBridge "Z" + Arch Bridge Emblem -->
  <!-- Top bridge beam / Z-top -->
  <path d="M16 20 L44 20 C46.2 20 48 21.8 48 24 L48 24 C48 25.5 47.1 26.8 45.8 27.5 L24 39 L46 39 C47.7 39 49 40.3 49 42 L49 43 C49 44.7 47.7 46 46 46 L18 46 C15.8 46 14 44.2 14 42 L14 42 C14 40.5 14.9 39.2 16.2 38.5 L38 27 L18 27 C16.3 27 15 25.7 15 24 L15 23 C15 21.3 16.3 20 18 20 Z" fill="url(#tealGrad)" />

  <!-- Diagonal bridge span dynamic highlight -->
  <path d="M22 36 L41 26" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Bridge suspension node dots -->
  <circle cx="18" cy="23.5" r="2" fill="#38bdf8"/>
  <circle cx="46" cy="42.5" r="2" fill="#38bdf8"/>
  <circle cx="32" cy="32" r="2.5" fill="#5eead4"/>
</svg>
